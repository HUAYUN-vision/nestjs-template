name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: HUAYUN-vision/ci-cd-workflows/.github/workflows/node-ci.yml@main
    permissions:
      contents: read
    # secrets:
    #   socket-token: ${{ secrets.SOCKET_API_KEY }} # Socket Firewall Enterprise

  version:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: HUAYUN-vision/ci-cd-workflows/.github/workflows/version.yml@main
    permissions:
      contents: write
    # secrets:
    #   token: ${{ secrets.RELEASE_TOKEN }} # если main защищена от прямого push
